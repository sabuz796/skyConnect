name: Deploy to GitHub Pages

on:
  push:
    # develop, not main: main is behind, so deploying from it would publish
    # stale code. See the branch comparison in the deploy plan.
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than racing a second one, and cancel a
# superseded one so a rapid push sequence cannot leave Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, not npm install: the lockfile is committed, and a lockfile that
      # has drifted from package.json should fail the deploy rather than
      # silently resolving to different versions than were tested.
      - name: Install dependencies
        run: npm ci

      # Before the build, so a red suite never reaches Pages.
      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
